name: R checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Install test dependencies
        shell: Rscript {0}
        run: install.packages(c('Matrix', 'xgboost', 'dplyr'), repos = 'https://cloud.r-project.org')
      - name: Run targeted checks
        run: Rscript tests/run_tests.R
